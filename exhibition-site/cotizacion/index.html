---
layout: false
---
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Cotización - CronusFit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-blue-900 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-bold">CronusFit</a>
      <nav class="space-x-4 text-sm">
        <a href="/" class="hover:underline">Inicio</a>
        <a href="/products/" class="hover:underline">Productos</a>
        <a href="/cotizacion/" class="font-semibold underline">Cotización</a>
        <a href="/estado/" class="hover:underline">Estado</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Solicitar Cotización</h1>
    
    <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
      <p class="font-bold">¡Solicitud enviada con éxito!</p>
      <p>Tu número de seguimiento es: <span id="trackingNumber" class="font-mono font-bold"></span></p>
      <p class="text-sm mt-2">Te hemos enviado un correo de confirmación.</p>
    </div>

    <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
      <p class="font-bold">Error</p>
      <p id="errorText" class="text-sm"></p>
    </div>

    <form id="quoteForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 space-y-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2" for="clientName">Nombre completo</label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="clientName" name="clientName" type="text" required>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Correo electrónico</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="email" name="email" type="email" required>
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">Teléfono (WhatsApp)</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="phone" name="phone" type="tel" placeholder="+56 9 1234 5678" required>
        </div>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2" for="productId">Producto de interés</label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="productId" name="productId" type="text" placeholder="Ej: Camiseta deportiva" required>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="quantity">Cantidad</label>
          <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="quantity" name="quantity" type="number" min="1" required>
        </div>
        <div>
          <label class="block text-gray-700 text-sm font-bold mb-2" for="ageGroup">Grupo etario</label>
          <select class="shadow border rounded w-full py-2 px-3 text-gray-700" id="ageGroup" name="ageGroup" required>
            <option value="">Selecciona</option>
            <option value="adult">Adulto</option>
            <option value="children">Infantil</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Tallas (Ctrl+click para múltiples)</label>
        <select class="shadow border rounded w-full py-2 px-3 text-gray-700" id="sizes" name="sizes" multiple size="4" required>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
          <option value="2T">2T (Infantil)</option>
          <option value="4T">4T (Infantil)</option>
          <option value="6">6 (Infantil)</option>
          <option value="8">8 (Infantil)</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2" for="customizationNotes">Notas (opcional)</label>
        <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="customizationNotes" name="customizationNotes" rows="3" maxlength="1000"></textarea>
      </div>

      <!-- hCaptcha widget -->
      <div class="my-4">
        <div class="h-captcha" data-sitekey="3e2ae7d0-297c-4b58-8160-7546c482c552"></div>
      </div>

      <button id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full" type="submit">
        Enviar Solicitud
      </button>
      <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    </form>
  </main>

  <footer class="bg-gray-800 text-white text-center py-4 text-sm">
    <p>© 2026 CronusFit. Todos los derechos reservados.</p>
  </footer>

 <script>
  // Esperar a que hCaptcha esté cargado
  function waitForHCaptcha(callback, maxAttempts = 50) {
    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      if (typeof hcaptcha !== 'undefined' && hcaptcha.getResponse) {
        clearInterval(interval);
        callback();
      } else if (attempts >= maxAttempts) {
        clearInterval(interval);
        console.error('hCaptcha no se cargó después de 5 segundos');
        const errorMsg = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        if (errorMsg && errorText) {
          errorText.textContent = 'Error al cargar el CAPTCHA. Recarga la página e intenta de nuevo.';
          errorMsg.classList.remove('hidden');
        }
      }
    }, 100);
  }

  document.getElementById('quoteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    
    successMsg.classList.add('hidden');
    errorMsg.classList.add('hidden');
    
    // Verificar que hCaptcha está cargado
    if (typeof hcaptcha === 'undefined') {
      errorText.textContent = 'El CAPTCHA aún no está listo. Espera un momento e intenta de nuevo.';
      errorMsg.classList.remove('hidden');
      return;
    }

    // Obtener token de hCaptcha
    let captchaToken;
    try {
      captchaToken = hcaptcha.getResponse();
    } catch (error) {
      console.error('Error al obtener token de hCaptcha:', error);
      errorText.textContent = 'Error con el CAPTCHA. Recarga la página.';
      errorMsg.classList.remove('hidden');
      return;
    }

    if (!captchaToken) {
      errorText.textContent = 'Por favor, completa el CAPTCHA';
      errorMsg.classList.remove('hidden');
      return;
    }

    // Obtener tallas seleccionadas
    const sizesSelect = document.getElementById('sizes');
    const selectedSizes = Array.from(sizesSelect.selectedOptions).map(opt => opt.value);

    const payload = {
      clientName: document.getElementById('clientName').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      productId: document.getElementById('productId').value.trim(),
      quantity: parseInt(document.getElementById('quantity').value, 10),
      ageGroup: document.getElementById('ageGroup').value,
      sizes: selectedSizes,
      customizationNotes: document.getElementById('customizationNotes').value.trim(),
      captchaToken: captchaToken
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    try {
      const response = await fetch('https://dp5pdbigb1.execute-api.us-east-1.amazonaws.com/prod/quotes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        document.getElementById('trackingNumber').textContent = data.trackingNumber;
        successMsg.classList.remove('hidden');
        document.getElementById('quoteForm').reset();
        hcaptcha.reset();
      } else {
        throw new Error(data.message || 'Error al enviar');
      }
    } catch (error) {
      errorText.textContent = error.message;
      errorMsg.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar Solicitud';
    }
  });
</script>
</body>
</html>
