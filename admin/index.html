<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    connect-src 'self'
      https://dp5pdbigb1.execute-api.us-east-1.amazonaws.com
      https://cognito-idp.us-east-1.amazonaws.com
      https://cognito-identity.us-east-1.amazonaws.com;
    style-src 'self' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: https://cronusfit-exhibition-site-prod.s3.amazonaws.com;
  ">
  <title>CronusFit — Panel de Administración</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen font-sans">

  <!-- Network offline banner (hidden by default) -->
  <div id="network-banner"
       role="alert"
       class="hidden fixed top-0 inset-x-0 z-50 bg-amber-500 text-white text-center py-2 text-sm font-medium">
    ⚠️ Sin conexión a internet — las acciones están deshabilitadas
  </div>

  <!-- App layout: sidebar + main -->
  <div class="flex min-h-screen">

    <!-- ===================== SIDEBAR ===================== -->
    <aside id="sidebar"
           aria-label="Navegación principal"
           class="w-64 bg-brand-blue text-white flex flex-col flex-shrink-0 min-h-screen transition-transform duration-300 fixed inset-y-0 left-0 z-40
                  md:relative md:translate-x-0
                  -translate-x-full">

      <!-- Sidebar header: brand -->
      <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
        <img src="../assets/images/logo-cronusfit.png"
             alt="CronusFit"
             class="h-10 w-auto flex-shrink-0">
        <div>
          <span class="font-bold text-lg text-white leading-tight block">CronusFit</span>
          <span class="text-brand-gold text-[10px] font-medium uppercase tracking-[0.2em]">Panel Admin</span>
        </div>
      </div>

      <!-- Nav items (rendered by sidebar.js) -->
      <nav id="sidebar-nav"
           aria-label="Secciones del panel"
           class="flex-1 py-4 overflow-y-auto">
        <!-- Populated by sidebar.js -->
      </nav>

      <!-- Sidebar footer: logout -->
      <div class="px-4 py-4 border-t border-white/10">
        <button id="btn-logout"
                class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-colors text-sm font-medium"
                aria-label="Cerrar sesión"
                data-requires-network>
          <!-- Logout icon -->
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay"
         class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"
         aria-hidden="true">
    </div>

    <!-- ===================== MAIN CONTENT ===================== -->
    <div class="flex-1 flex flex-col min-w-0 md:ml-0">

      <!-- Top header -->
      <header class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm"
              role="banner">
        <div class="flex items-center justify-between h-16 px-4 sm:px-6">

          <!-- Hamburger (mobile) -->
          <button id="btn-hamburger"
                  class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-gold/50"
                  aria-label="Abrir menú de navegación"
                  aria-expanded="false"
                  aria-controls="sidebar">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>

          <!-- Page title (updated by router) -->
          <h1 id="page-title"
              class="text-brand-blue font-bold text-lg sm:text-xl truncate ml-2 md:ml-0">
            Panel de Administración
          </h1>

          <!-- Header right: logo + brand (desktop only) -->
          <div class="hidden sm:flex items-center gap-3 text-sm text-gray-500">
            <img src="../assets/images/logo-cronusfit.png"
                 alt=""
                 class="h-7 w-auto opacity-60"
                 aria-hidden="true">
            <span class="font-medium text-brand-blue">CronusFit Admin</span>
          </div>
        </div>
      </header>

      <!-- ===== MAIN APP CONTENT — sections render here ===== -->
      <main id="app-content"
            class="flex-1 p-4 sm:p-6 lg:p-8 overflow-auto"
            role="main"
            aria-live="polite"
            aria-atomic="false">
        <!-- Section content is injected here by the router -->
        <div class="flex items-center justify-center min-h-64" aria-label="Cargando...">
          <div class="flex flex-col items-center gap-3 text-gray-400">
            <svg class="w-10 h-10 animate-spin text-brand-gold" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="text-sm">Iniciando...</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===================== MODAL (hidden by default) ===================== -->
  <div id="modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title"
       class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full mx-auto"
         role="document">
      <h2 id="modal-title"
          class="text-brand-blue font-bold text-xl mb-4"></h2>
      <div id="modal-body" class="mb-6 text-gray-700"></div>
      <div class="flex justify-end gap-3">
        <button id="modal-cancel"
                onclick="Modal.close()"
                class="px-4 py-2 rounded-xl border-2 border-gray-200 text-gray-600 font-medium
                       hover:border-brand-blue hover:text-brand-blue transition-colors focus:outline-none
                       focus:ring-2 focus:ring-brand-blue/30">
          Cancelar
        </button>
        <button id="modal-confirm"
                class="px-4 py-2 rounded-xl bg-brand-blue text-white font-semibold
                       hover:bg-brand-blue-light transition-colors focus:outline-none
                       focus:ring-2 focus:ring-brand-blue/50
                       disabled:opacity-40 disabled:cursor-not-allowed">
          Confirmar
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST CONTAINER ===================== -->
  <div id="toast-container"
       aria-live="polite"
       aria-atomic="false"
       class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]">
    <!-- Toast notifications are injected here by toast.js -->
  </div>

  <!-- ===================== CDN LIBRARIES ===================== -->
  <!-- Amazon Cognito Identity SDK v6 -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"
          integrity="sha384-SVW/JUAWuaFjpcvT65qqpCfy5aD/6+mTPt046MJYXaNbaI70H1WE4fvhVc0iKOvi"
          crossorigin="anonymous"></script>

  <!-- jsPDF v2.5.1 -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
          integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
          crossorigin="anonymous"></script>

  <!-- ===================== APPLICATION MODULES (load order matters) ===================== -->
  <!-- 1. Bootstrap & event bus -->
  <script src="js/app.js"></script>
  <!-- 2. Hash-based SPA router -->
  <script src="js/router.js"></script>
  <!-- 3. Auth guard + Cognito wrapper -->
  <script src="js/auth.js"></script>
  <!-- 4. API Gateway HTTP client -->
  <script src="js/api.js"></script>
  <!-- 5. Toast notification component -->
  <script src="js/toast.js"></script>
  <!-- 6. Modal component -->
  <script src="js/modal.js"></script>
  <!-- 7. Sidebar navigation -->
  <script src="js/sidebar.js"></script>
  <!-- 8. Network connectivity monitor -->
  <script src="js/network.js"></script>

  <!-- ===================== SECTION MODULES ===================== -->
  <script src="js/sections/login.js"></script>
  <script src="js/sections/patrones.js"></script>
  <script src="js/sections/cotizaciones.js"></script>
  <script src="js/sections/mockups.js"></script>
  <script src="js/sections/aprobaciones.js"></script>
  <script src="js/sections/publicaciones.js"></script>
  <script src="js/sections/redes.js"></script>

</body>
</html>
